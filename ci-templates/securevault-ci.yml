name: SecureVault hardening CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install C++23 compiler and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 cmake ninja-build python3 \
            libarchive-dev libssh-dev libcurl4-openssl-dev zlib1g-dev libjsoncpp-dev
      - name: Validate Linux backup script syntax
        run: bash -n scripts/backup-restic.sh
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DSECUREVAULT_AUTO_INSTALL_BREW_DEPS=OFF \
            -DSECUREVAULT_REQUIRE_SFTP=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test backup semantics without live databases
        run: python3 tests/test_securevault.py build/backup
